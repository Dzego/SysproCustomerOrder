<div class="sidebar">
  <a class="sidebar__brand" routerLink="/dashboard" data-cy="brand-link" (click)="navigate.emit()">
    <span class="sidebar__logo" aria-hidden="true">S</span>
    <span class="sidebar__brand-text">
      <span class="sidebar__brand-name">SYSPRO</span>
      <span class="sidebar__brand-sub">Customer &amp; Orders</span>
    </span>
  </a>

  <nav class="sidebar__nav" aria-label="Primary">
    <ul class="sidebar__list" role="list">
      @for (item of items; track item.id) {
        <li>
          <a
            class="sidebar__link"
            [routerLink]="item.path"
            routerLinkActive="sidebar__link--active"
            ariaCurrentWhenActive="page"
            [attr.data-cy]="'nav-' + item.id"
            (click)="navigate.emit()"
          >
            <svg
              class="sidebar__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              @switch (item.icon) {
                @case ('dashboard') {
                  <rect x="3" y="3" width="7" height="9" rx="1.5" />
                  <rect x="14" y="3" width="7" height="5" rx="1.5" />
                  <rect x="14" y="12" width="7" height="9" rx="1.5" />
                  <rect x="3" y="16" width="7" height="5" rx="1.5" />
                }
                @case ('customers') {
                  <circle cx="9" cy="8" r="3.5" />
                  <path d="M2.5 20c.6-3.4 3.3-5.5 6.5-5.5s5.9 2.1 6.5 5.5" />
                  <path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.7.8 2.8 2.6 3 5.2" />
                }
                @case ('orders') {
                  <path d="M6 3h9l4 4v14H6z" />
                  <path d="M15 3v4h4M9.5 12h6M9.5 16h6" />
                }
                @case ('imports') {
                  <path d="M12 3v12M7.5 10.5 12 15l4.5-4.5" />
                  <path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" />
                }
              }
            </svg>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
