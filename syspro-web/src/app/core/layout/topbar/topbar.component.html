<header class="topbar">
  <button
    type="button"
    class="btn btn--ghost btn--icon topbar__menu"
    aria-controls="app-sidebar"
    [attr.aria-expanded]="navOpen"
    [attr.aria-label]="navOpen ? 'Close navigation' : 'Open navigation'"
    data-cy="nav-toggle"
    (click)="menuToggle.emit()"
  >
    <svg
      viewBox="0 0 24 24"
      width="22"
      height="22"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
      focusable="false"
    >
      @if (navOpen) {
        <path d="M6 6l12 12M18 6 6 18" />
      } @else {
        <path d="M4 7h16M4 12h16M4 17h16" />
      }
    </svg>
  </button>

  <p class="topbar__title">Customer &amp; Order Management</p>

  <span class="badge badge--info topbar__env" data-cy="topbar-environment">{{
    environmentName
  }}</span>
</header>
